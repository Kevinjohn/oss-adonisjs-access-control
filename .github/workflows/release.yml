name: release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
# Every job is gated on main, so a dispatch from another branch fails before the matrix runs.
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
  compat:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/compat.yml
  release:
    if: github.ref == 'refs/heads/main'
    needs: [checks, compat]
    runs-on: ubuntu-latest
    steps:
      - name: Only main releases
        run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        run: bash bin/release_check.sh
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v$VERSION" "$TARBALL" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file tmp/release/notes.md
